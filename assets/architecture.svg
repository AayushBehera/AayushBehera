<svg width="840" height="420" viewBox="0 0 840 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="linkGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="linkGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="linkGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="linkGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="840" height="420" fill="#030712"/>
  <rect width="840" height="420" fill="url(#archBg)"/>

  <!-- Subtle animated particles -->
  <g fill="#7C3AED" fill-opacity="0.1">
    <circle cx="60" cy="50" r="1.5"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="80" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="320" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.5s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="520" cy="60" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.8s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="680" cy="50" r="1.5"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.2s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="780" cy="30" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.6s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="100" cy="390" r="1.5"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.7s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="760" cy="390" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.9s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="640" cy="370" r="1.5"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.3s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="220" cy="380" r="1"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.1s" repeatCount="indefinite" begin="0.9s"/></circle>
  </g>

  <!-- Floating shapes -->
  <g opacity="0.08">
    <rect x="680" y="180" width="80" height="80" rx="8" stroke="#7C3AED" stroke-width="1.2" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 720 220" to="360 720 220" dur="24s" repeatCount="indefinite"/>
    </rect>
    <rect x="690" y="190" width="60" height="60" rx="6" stroke="#EC4899" stroke-width="0.8" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 720 220" to="0 720 220" dur="18s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0.06">
    <circle cx="100" cy="180" r="45" stroke="#22D3EE" stroke-width="1" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 100 180" to="360 100 180" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="180" r="25" stroke="#7C3AED" stroke-width="0.6" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 100 180" to="0 100 180" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="420" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle" letter-spacing="4">SYSTEM ARCHITECTURE</text>

  <!-- LAYER 1: React Frontend -->
  <g filter="url(#nodeGlow)">
    <rect x="335" y="62" width="170" height="42" rx="10" fill="#0D1117" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="420" y="89" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#A78BFA" text-anchor="middle">React Frontend</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="420" y1="104" x2="420" y2="132" stroke="#7C3AED" stroke-opacity="0.6" stroke-width="1.8"/>
  <polygon points="416,129 420,137 424,129" fill="#7C3AED" fill-opacity="0.6"/>

  <!-- LAYER 2: API Gateway -->
  <g filter="url(#nodeGlow)">
    <rect x="335" y="138" width="170" height="42" rx="10" fill="#0D1117" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="420" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F472B6" text-anchor="middle">API Gateway</text>
  </g>

  <!-- Branch Left -->
  <line x1="335" y1="159" x2="185" y2="159" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1.3"/>
  <line x1="185" y1="159" x2="185" y2="212" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1.3"/>
  <polygon points="181,209 185,217 189,209" fill="#7C3AED" fill-opacity="0.35"/>

  <!-- Branch Right -->
  <line x1="505" y1="159" x2="655" y2="159" stroke="#EC4899" stroke-opacity="0.35" stroke-width="1.3"/>
  <line x1="655" y1="159" x2="655" y2="212" stroke="#EC4899" stroke-opacity="0.35" stroke-width="1.3"/>
  <polygon points="651,209 655,217 659,209" fill="#EC4899" fill-opacity="0.35"/>

  <!-- Center down -->
  <line x1="420" y1="180" x2="420" y2="204" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1.3"/>

  <!-- LAYER 3: FastAPI -->
  <g filter="url(#nodeGlow)">
    <rect x="325" y="212" width="190" height="42" rx="10" fill="#0D1117" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="420" y="239" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#67E8F9" text-anchor="middle">FastAPI Core</text>
  </g>

  <!-- Service Left -->
  <g opacity="0.7">
    <rect x="85" y="216" width="160" height="32" rx="7" fill="rgba(124,58,237,0.05)" stroke="#7C3AED" stroke-opacity="0.18" stroke-width="0.9"/>
    <text x="165" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#A78BFA" text-anchor="middle">Authentication Service</text>
  </g>

  <!-- Service Right -->
  <g opacity="0.7">
    <rect x="595" y="216" width="160" height="32" rx="7" fill="rgba(236,72,153,0.05)" stroke="#EC4899" stroke-opacity="0.18" stroke-width="0.9"/>
    <text x="675" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#F472B6" text-anchor="middle">WebSocket Gateway</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="420" y1="254" x2="420" y2="280" stroke="#7C3AED" stroke-opacity="0.6" stroke-width="1.8"/>
  <polygon points="416,277 420,285 424,277" fill="#7C3AED" fill-opacity="0.6"/>

  <!-- LAYER 4: Data Layer -->
  <g filter="url(#nodeGlow)">
    <rect x="320" y="288" width="200" height="44" rx="10" fill="#0D1117" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="420" y="316" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#C4B5FD" text-anchor="middle">PostgreSQL / Redis</text>
  </g>

  <!-- AI Layer -->
  <g filter="url(#nodeGlow)">
    <rect x="560" y="294" width="155" height="32" rx="7" fill="rgba(124,58,237,0.08)" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1"/>
    <text x="637.5" y="316" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#7C3AED" text-anchor="middle">LLMs / AI Models</text>
  </g>

  <!-- Docker -->
  <g filter="url(#nodeGlow)">
    <rect x="125" y="294" width="120" height="32" rx="7" fill="rgba(34,211,238,0.05)" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1"/>
    <text x="185" y="316" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#22D3EE" text-anchor="middle">Docker</text>
  </g>

  <!-- Connection lines -->
  <line x1="420" y1="288" x2="637.5" y2="294" stroke="#7C3AED" stroke-opacity="0.25" stroke-width="0.9" stroke-dasharray="5,4"/>
  <line x1="420" y1="288" x2="185" y2="294" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="0.9" stroke-dasharray="5,4"/>
</svg>