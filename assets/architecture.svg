<svg width="780" height="380" viewBox="0 0 780 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="380" fill="#0D1117"/>
  
  <defs>
    <linearGradient id="archGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="lineV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="780" height="380" fill="url(#archGlow)"/>
  
  <text x="390" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="2">SYSTEM ARCHITECTURE</text>
  
  <!-- Layer 1: Frontend -->
  <rect x="290" y="65" width="200" height="44" rx="8" fill="#161B22" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="390" y="92" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#F8FAFC" text-anchor="middle">React Frontend</text>
  
  <!-- Arrow down -->
  <line x1="390" y1="109" x2="390" y2="140" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="386,137 390,145 394,137" fill="#7C3AED" fill-opacity="0.4"/>
  
  <!-- Layer 2: API Gateway -->
  <rect x="290" y="145" width="200" height="44" rx="8" fill="#161B22" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="390" y="172" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#F8FAFC" text-anchor="middle">API Gateway</text>
  
  <!-- Arrow branching left -->
  <line x1="290" y1="167" x2="150" y2="167" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="150" y1="167" x2="150" y2="230" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.5"/>
  <polygon points="146,227 150,235 154,227" fill="#7C3AED" fill-opacity="0.3"/>
  
  <!-- Arrow branching right -->
  <line x1="490" y1="167" x2="630" y2="167" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="630" y1="167" x2="630" y2="230" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.5"/>
  <polygon points="626,227 630,235 634,227" fill="#22D3EE" fill-opacity="0.3"/>
  
  <!-- Arrow straight down -->
  <line x1="390" y1="189" x2="390" y2="222" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Layer 3: Backend Services -->
  <rect x="290" y="226" width="200" height="44" rx="8" fill="#161B22" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="390" y="253" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#F8FAFC" text-anchor="middle">FastAPI</text>
  
  <!-- Left service -->
  <rect x="60" y="230" width="170" height="36" rx="8" fill="#161B22" stroke="#7C3AED" stroke-opacity="0.15" stroke-width="1"/>
  <text x="145" y="253" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle">Authentication</text>
  
  <!-- Right service -->
  <rect x="550" y="230" width="170" height="36" rx="8" fill="#161B22" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="1"/>
  <text x="635" y="253" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle">WebSocket Handler</text>
  
  <!-- Arrow down from FastAPI -->
  <line x1="390" y1="270" x2="390" y2="300" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="386,297 390,305 394,297" fill="#7C3AED" fill-opacity="0.4"/>
  
  <!-- Layer 4: Data / AI Layer -->
  <rect x="290" y="305" width="200" height="44" rx="8" fill="#161B22" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="390" y="332" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#F8FAFC" text-anchor="middle">PostgreSQL / Redis</text>
  
  <!-- AI Layer side -->
  <rect x="540" y="310" width="140" height="34" rx="8" fill="rgba(124, 58, 237, 0.08)" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1"/>
  <text x="610" y="332" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#7C3AED" text-anchor="middle">LLMs / AI</text>
  
  <!-- Container badge -->
  <rect x="100" y="310" width="120" height="34" rx="8" fill="rgba(34, 211, 238, 0.06)" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="1"/>
  <text x="160" y="332" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#22D3EE" text-anchor="middle">Docker</text>
</svg>