<svg width="780" height="380" viewBox="0 0 780 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="380" fill="#0D1117"/>
  
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="780" height="380" fill="url(#archBg)"/>
  
  <text x="390" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle" letter-spacing="3">SYSTEM ARCHITECTURE</text>
  
  <!-- Layer 1: Frontend -->
  <rect x="300" y="60" width="180" height="40" rx="8" fill="#161B22" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="390" y="86" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#7C3AED" text-anchor="middle">React Frontend</text>
  
  <!-- Arrow down -->
  <line x1="390" y1="100" x2="390" y2="130" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>
  <polygon points="386,127 390,135 394,127" fill="#7C3AED" fill-opacity="0.5"/>
  
  <!-- Layer 2: API Gateway -->
  <rect x="300" y="135" width="180" height="40" rx="8" fill="#161B22" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="390" y="161" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EC4899" text-anchor="middle">API Gateway</text>
  
  <!-- Branch left -->
  <line x1="300" y1="155" x2="160" y2="155" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>
  <line x1="160" y1="155" x2="160" y2="215" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>
  <polygon points="156,212 160,220 164,212" fill="#7C3AED" fill-opacity="0.3"/>
  
  <!-- Branch right -->
  <line x1="480" y1="155" x2="620" y2="155" stroke="#EC4899" stroke-opacity="0.3" stroke-width="1.2"/>
  <line x1="620" y1="155" x2="620" y2="215" stroke="#EC4899" stroke-opacity="0.3" stroke-width="1.2"/>
  <polygon points="616,212 620,220 624,212" fill="#EC4899" fill-opacity="0.3"/>
  
  <!-- Arrow down -->
  <line x1="390" y1="175" x2="390" y2="207" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>
  
  <!-- Layer 3: Backend -->
  <rect x="300" y="210" width="180" height="40" rx="8" fill="#161B22" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="390" y="236" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#22D3EE" text-anchor="middle">FastAPI</text>
  
  <!-- Left service -->
  <rect x="70" y="215" width="170" height="30" rx="6" fill="rgba(124,58,237,0.06)" stroke="#7C3AED" stroke-opacity="0.15" stroke-width="0.8"/>
  <text x="155" y="236" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#a78bfa" text-anchor="middle">Authentication</text>
  
  <!-- Right service -->
  <rect x="540" y="215" width="170" height="30" rx="6" fill="rgba(236,72,153,0.06)" stroke="#EC4899" stroke-opacity="0.15" stroke-width="0.8"/>
  <text x="625" y="236" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f472b6" text-anchor="middle">WebSocket Handler</text>
  
  <!-- Arrow down -->
  <line x1="390" y1="250" x2="390" y2="278" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>
  <polygon points="386,275 390,283 394,275" fill="#7C3AED" fill-opacity="0.5"/>
  
  <!-- Layer 4: Data Layer -->
  <rect x="290" y="285" width="200" height="40" rx="8" fill="#161B22" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="390" y="311" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#C4B5FD" text-anchor="middle">PostgreSQL / Redis</text>
  
  <!-- AI -->
  <rect x="530" y="290" width="150" height="30" rx="6" fill="rgba(124,58,237,0.08)" stroke="#7C3AED" stroke-opacity="0.25" stroke-width="0.8"/>
  <text x="605" y="311" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#7C3AED" text-anchor="middle">LLMs / AI Models</text>
  
  <!-- Docker -->
  <rect x="100" y="290" width="130" height="30" rx="6" fill="rgba(34,211,238,0.06)" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="0.8"/>
  <text x="165" y="311" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#22D3EE" text-anchor="middle">Docker</text>

  <!-- Connection lines at bottom -->
  <line x1="390" y1="285" x2="605" y2="290" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="390" y1="285" x2="165" y2="290" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="4,3"/>
</svg>