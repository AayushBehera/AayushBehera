<svg width="100%" height="400" viewBox="0 0 900 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="400" fill="#0D1117"/>
  
  <!-- Subtle gradient background -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="400" fill="url(#glow)"/>
  
  <!-- Decorative geometric elements -->
  <circle cx="750" cy="80" r="60" stroke="#7C3AED" stroke-opacity="0.15" stroke-width="1" fill="none"/>
  <circle cx="750" cy="80" r="40" stroke="#7C3AED" stroke-opacity="0.1" stroke-width="0.5" fill="none"/>
  <circle cx="750" cy="80" r="20" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="0.5" fill="none"/>
  
  <rect x="680" y="280" width="80" height="80" rx="8" stroke="#7C3AED" stroke-opacity="0.12" stroke-width="1" fill="none" transform="rotate(15, 720, 320)"/>
  <rect x="690" y="290" width="60" height="60" rx="6" stroke="#22D3EE" stroke-opacity="0.08" stroke-width="0.5" fill="none" transform="rotate(15, 720, 320)"/>
  
  <circle cx="120" cy="320" r="45" stroke="#22D3EE" stroke-opacity="0.1" stroke-width="1" fill="none"/>
  <circle cx="120" cy="320" r="25" stroke="#7C3AED" stroke-opacity="0.08" stroke-width="0.5" fill="none"/>
  
  <!-- Grid dots -->
  <g fill="#7C3AED" fill-opacity="0.08">
    <circle cx="100" cy="50" r="1.5"/>
    <circle cx="200" cy="80" r="1"/>
    <circle cx="300" cy="40" r="1.5"/>
    <circle cx="500" cy="60" r="1"/>
    <circle cx="600" cy="100" r="1.5"/>
    <circle cx="800" cy="50" r="1"/>
    <circle cx="850" cy="150" r="1.5"/>
    <circle cx="50" cy="200" r="1"/>
    <circle cx="150" cy="150" r="1.5"/>
    <circle cx="780" cy="200" r="1"/>
    <circle cx="650" cy="350" r="1.5"/>
    <circle cx="200" cy="350" r="1"/>
  </g>
  
  <!-- Accent line -->
  <rect x="80" y="155" width="200" height="1.5" fill="url(#lineGrad)" rx="1"/>
  
  <!-- Main content -->
  <text x="80" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="2">
    AAYUSH BEHERA
  </text>
  
  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="1">
    Frontend Engineer
  </text>
  <text x="80" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#7C3AED" letter-spacing="1">
    Full-Stack Developer
  </text>
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#22D3EE" letter-spacing="1">
    AI-Assisted Software Engineer
  </text>
  
  <!-- Subtle brand mark at bottom right -->
  <text x="820" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#7C3AED" fill-opacity="0.3" letter-spacing="3" text-anchor="end">
    AB
  </text>
</svg>