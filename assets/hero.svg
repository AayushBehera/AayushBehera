<svg width="100%" height="460" viewBox="0 0 960 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep space background -->
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="30%" stop-color="#0D1117"/>
      <stop offset="70%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Animated aurora gradients -->
    <radialGradient id="aurora1" cx="0.15" cy="0.15" r="0.6" fx="0.15" fy="0.15">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.25;0.4;0.25" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.1;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora2" cx="0.85" cy="0.2" r="0.55" fx="0.85" fy="0.2">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.2;0.35;0.2" dur="5s" repeatCount="indefinite" begin="1s"/>
      </stop>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.08;0" dur="5s" repeatCount="indefinite" begin="1s"/>
      </stop>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora3" cx="0.5" cy="0.9" r="0.5" fx="0.5" fy="0.9">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.15;0.3;0.15" dur="7s" repeatCount="indefinite" begin="2s"/>
      </stop>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.06;0" dur="7s" repeatCount="indefinite" begin="2s"/>
      </stop>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradients -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0">
        <animate attributeName="stop-color" values="#E2E8F0;#F8FAFC;#E2E8F0" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="1">
        <animate attributeName="offset" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="badgeGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Noise texture -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="960" height="460" fill="url(#space)" filter="url(#noise)"/>
  <rect width="960" height="460" fill="url(#aurora1)"/>
  <rect width="960" height="460" fill="url(#aurora2)"/>
  <rect width="960" height="460" fill="url(#aurora3)"/>

  <!-- Constellation: animated stars -->
  <g fill="#7C3AED" fill-opacity="0.4">
    <circle cx="40" cy="50" r="1.2">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="90" r="0.8">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="280" cy="35" r="1.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="420" cy="60" r="0.9">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="580" cy="40" r="1.3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="720" cy="70" r="0.8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="880" cy="35" r="1.2">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.6s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="80" cy="410" r="1">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.7s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="760" cy="400" r="1.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.9s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="650" cy="380" r="1.2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="180" cy="420" r="0.9">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.1s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="360" cy="30" r="0.7">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.6s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="500" cy="85" r="0.7">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.7s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="680" cy="25" r="1">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
    <circle cx="850" cy="95" r="0.6">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.1s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <circle cx="30" cy="150" r="1.1">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- Floating geometric constellation -->
  <g filter="url(#softGlow)">
    <!-- Orbital ring 1 -->
    <circle cx="820" cy="120" r="55" stroke="url(#badgeGrad1)" stroke-width="0.6" fill="none" stroke-opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0 820 120" to="360 820 120" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="120" r="35" stroke="url(#badgeGrad3)" stroke-width="0.4" fill="none" stroke-opacity="0.1">
      <animateTransform attributeName="transform" type="rotate" from="360 820 120" to="0 820 120" dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbital ring 2 -->
    <ellipse cx="130" cy="180" rx="45" ry="25" stroke="url(#badgeGrad2)" stroke-width="0.5" fill="none" stroke-opacity="0.12" transform="rotate(-20 130 180)">
      <animateTransform attributeName="transform" type="rotate" from="-20 130 180" to="340 130 180" dur="28s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Floating diamonds -->
    <g opacity="0.08">
      <rect x="50" y="60" width="20" height="20" rx="3" fill="#7C3AED" transform="rotate(45 60 70)">
        <animateTransform attributeName="transform" type="rotate" from="45 60 70" to="405 60 70" dur="25s" repeatCount="indefinite"/>
      </rect>
      <rect x="880" y="380" width="14" height="14" rx="2" fill="#EC4899" transform="rotate(-30 887 387)">
        <animateTransform attributeName="transform" type="rotate" from="-30 887 387" to="330 887 387" dur="18s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Breathing orb -->
    <circle cx="700" cy="280" r="85" fill="url(#badgeGrad1)" fill-opacity="0.02">
      <animate attributeName="r" values="85;105;85" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.02;0.05;0.02" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="280" r="110" fill="url(#badgeGrad3)" fill-opacity="0.015">
      <animate attributeName="r" values="110;135;110" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.015;0.04;0.015" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Accent line with flowing animation -->
  <rect x="60" y="150" width="280" height="2" rx="1" fill="url(#accentLine)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- NAME - Staggered letter-by-letter entrance -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" fill="url(#nameGrad)" filter="url(#textGlow)">
    <text x="60" y="120" font-size="52" letter-spacing="3">
      AAYUSH BEHERA
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 30" to="0 0" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </text>
  </g>

  <!-- Role badges - sequential reveal -->
  <g font-family="system-ui, sans-serif" font-weight="600" font-size="13">
    <!-- Badge 1 -->
    <g>
      <rect x="60" y="185" width="195" height="36" rx="18" fill="url(#badgeGrad1)" fill-opacity="0.18" stroke="url(#badgeGrad1)" stroke-width="0.8" stroke-opacity="0.4">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.7s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="0.6s" begin="0.7s" fill="freeze"/>
      </rect>
      <text x="157.5" y="210" fill="url(#badgeGrad1)" text-anchor="middle" letter-spacing="1.5">
        Frontend Engineer
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.7s" fill="freeze"/>
      </text>
    </g>

    <!-- Badge 2 -->
    <g>
      <rect x="270" y="185" width="215" height="36" rx="18" fill="url(#badgeGrad2)" fill-opacity="0.16" stroke="url(#badgeGrad2)" stroke-width="0.8" stroke-opacity="0.35">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="0.6s" begin="1.1s" fill="freeze"/>
      </rect>
      <text x="377.5" y="210" fill="url(#badgeGrad2)" text-anchor="middle" letter-spacing="1.5">
        Full-Stack Developer
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>
      </text>
    </g>

    <!-- Badge 3 -->
    <g>
      <rect x="500" y="185" width="260" height="36" rx="18" fill="url(#badgeGrad3)" fill-opacity="0.16" stroke="url(#badgeGrad3)" stroke-width="0.8" stroke-opacity="0.35">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="0.6s" begin="1.5s" fill="freeze"/>
      </rect>
      <text x="630" y="210" fill="url(#badgeGrad3)" text-anchor="middle" letter-spacing="1.5">
        AI-Assisted Software Engineer
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
      </text>
    </g>
  </g>

  <!-- Tagline with typewriter effect simulation -->
  <g font-family="system-ui, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
    <text x="60" y="270">
      Building AI-powered software, modern frontend experiences,
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 25" to="0 0" dur="1s" begin="2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </text>
    <text x="60" y="300">
      and scalable developer platforms.
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 25" to="0 0" dur="1s" begin="2.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </text>
  </g>

  <!-- CTA Bar - sequential reveal -->
  <g font-family="system-ui, sans-serif" font-weight="700" font-size="13">
    <!-- GitHub -->
    <g>
      <rect x="60" y="345" width="150" height="42" rx="21" fill="url(#badgeGrad1)" fill-opacity="0.95" filter="url(#softGlow)">
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="3.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" from="0.8 0.8" to="1 1" dur="0.7s" begin="3.2s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </rect>
      <text x="135" y="372" fill="#0D1117" text-anchor="middle" letter-spacing="1">
        GitHub
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="3.2s" fill="freeze"/>
      </text>
    </g>

    <!-- LinkedIn -->
    <g>
      <rect x="225" y="345" width="150" height="42" rx="21" fill="url(#badgeGrad2)" fill-opacity="0.95" filter="url(#softGlow)">
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="3.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" from="0.8 0.8" to="1 1" dur="0.7s" begin="3.5s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </rect>
      <text x="300" y="372" fill="#0D1117" text-anchor="middle" letter-spacing="1">
        LinkedIn
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="3.5s" fill="freeze"/>
      </text>
    </g>

    <!-- Portfolio -->
    <g>
      <rect x="390" y="345" width="150" height="42" rx="21" fill="transparent" stroke="url(#badgeGrad3)" stroke-width="1.2" stroke-opacity="0.6">
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="3.8s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" from="0.8 0.8" to="1 1" dur="0.7s" begin="3.8s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </rect>
      <text x="465" y="372" fill="url(#badgeGrad3)" text-anchor="middle" letter-spacing="1">
        Portfolio
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="3.8s" fill="freeze"/>
      </text>
    </g>

    <!-- Resume -->
    <g>
      <rect x="555" y="345" width="150" height="42" rx="21" fill="transparent" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4">
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="4.1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" from="0.8 0.8" to="1 1" dur="0.7s" begin="4.1s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
        <animate attributeName="stroke-dashoffset" from="20" to="0" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="630" y="372" fill="#a78bfa" text-anchor="middle" letter-spacing="1">
        Resume
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="4.1s" fill="freeze"/>
      </text>
    </g>
  </g>

  <!-- Bottom brand mark -->
  <text x="900" y="435" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7C3AED" fill-opacity="0.15" letter-spacing="5" text-anchor="end">
    AB
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="4.5s" fill="freeze"/>
  </text>
</svg>