<svg width="100%" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.2;0.35;0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.1">
        <animate attributeName="stop-opacity" values="0.1;0.2;0.1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gradient1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" fill="url(#bg)"/>
  <rect width="900" height="420" fill="url(#glow1)"/>

  <!-- Animated grid dots -->
  <g fill="#7C3AED" fill-opacity="0.15">
    <circle cx="50" cy="60" r="2">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100" r="1.5">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="280" cy="40" r="2">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="450" cy="70" r="1.5">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="620" cy="50" r="2">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="780" cy="80" r="1.5">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="850" cy="30" r="2">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.6s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="100" cy="370" r="2">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.7s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="800" cy="370" r="1.5">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.9s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="700" cy="350" r="2">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.3s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="200" cy="380" r="1.5">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.1s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="350" cy="30" r="1">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.6s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="520" cy="90" r="1">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.7s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="680" cy="30" r="1.5">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.8s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
    <circle cx="870" cy="100" r="1">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.1s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <circle cx="40" cy="150" r="1.5">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.4s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- Floating geometric shapes -->
  <g opacity="0.12">
    <rect x="730" y="220" width="70" height="70" rx="6" stroke="#7C3AED" stroke-width="1.2" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 765 255" to="360 765 255" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="740" y="230" width="50" height="50" rx="4" stroke="#EC4899" stroke-width="0.8" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 765 255" to="0 765 255" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <g opacity="0.1">
    <circle cx="110" cy="220" r="40" stroke="#22D3EE" stroke-width="1" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 110 220" to="360 110 220" dur="25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="220" r="20" stroke="#7C3AED" stroke-width="0.6" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 110 220" to="0 110 220" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.08">
    <rect x="60" y="60" width="30" height="30" rx="4" stroke="#EC4899" stroke-width="0.8" fill="none" transform="rotate(30, 75, 75)">
      <animateTransform attributeName="transform" type="rotate" from="30 75 75" to="390 75 75" dur="22s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pulsing orb -->
  <circle cx="650" cy="280" r="100" fill="#7C3AED" fill-opacity="0.03">
    <animate attributeName="r" values="100;120;100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.03;0.06;0.03" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="280" r="100" fill="#22D3EE" fill-opacity="0.02">
    <animate attributeName="r" values="100;130;100" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.02;0.05;0.02" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Accent line animation -->
  <rect x="80" y="155" width="240" height="2" rx="1" fill="url(#gradient2)">
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Main content with entrance animations -->
  <g>
    <text x="80" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="url(#textGrad)" letter-spacing="2">
      AAYUSH BEHERA
      <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- Role badges with delay -->
  <g>
    <rect x="80" y="175" width="180" height="32" rx="16" fill="rgba(124,58,237,0.15)" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="0.5">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="170" y="197" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#7C3AED" text-anchor="middle" letter-spacing="1">
      Frontend Engineer
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
    </text>
  </g>

  <g>
    <rect x="275" y="175" width="200" height="32" rx="16" fill="rgba(236,72,153,0.12)" stroke="#EC4899" stroke-opacity="0.3" stroke-width="0.5">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1s" fill="freeze"/>
    </rect>
    <text x="375" y="197" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#EC4899" text-anchor="middle" letter-spacing="1">
      Full-Stack Developer
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1s" fill="freeze"/>
    </text>
  </g>

  <g>
    <rect x="490" y="175" width="240" height="32" rx="16" fill="rgba(34,211,238,0.12)" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="0.5">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.5s" fill="freeze"/>
    </rect>
    <text x="610" y="197" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#22D3EE" text-anchor="middle" letter-spacing="1">
      AI-Assisted Software Engineer
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- Tagline with slide-up -->
  <g>
    <text x="80" y="250" font-family="-apple-system, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.5">
      Building AI-powered software, modern frontend experiences,
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="1s" begin="2s" fill="freeze"/>
    </text>
    <text x="80" y="275" font-family="-apple-system, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.5">
      and scalable developer platforms.
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="1s" begin="2.3s" fill="freeze"/>
    </text>
  </g>

  <!-- CTA Bar at bottom -->
  <g>
    <rect x="80" y="330" width="140" height="36" rx="18" fill="#7C3AED" fill-opacity="0.9">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3s" fill="freeze"/>
    </rect>
    <text x="150" y="353" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">
      GitHub
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3s" fill="freeze"/>
    </text>
  </g>
  <g>
    <rect x="235" y="330" width="140" height="36" rx="18" fill="#22D3EE" fill-opacity="0.9">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.3s" fill="freeze"/>
    </rect>
    <text x="305" y="353" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#0D1117" text-anchor="middle" letter-spacing="1">
      LinkedIn
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.3s" fill="freeze"/>
    </text>
  </g>
  <g>
    <rect x="390" y="330" width="140" height="36" rx="18" fill="#EC4899" fill-opacity="0.5" stroke="#EC4899" stroke-opacity="0.4" stroke-width="0.5">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.6s" fill="freeze"/>
    </rect>
    <text x="460" y="353" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#EC4899" text-anchor="middle" letter-spacing="1">
      Portfolio
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.6s" fill="freeze"/>
    </text>
  </g>

  <!-- Brand mark -->
  <text x="850" y="395" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#7C3AED" fill-opacity="0.25" letter-spacing="4" text-anchor="end">
    AB
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="4s" fill="freeze"/>
  </text>
</svg>