<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Aayush Behera — engineering dashboard</title>
<desc id="desc">A dark editorial developer dashboard with abstract pixel companions, terminal panels, orbit lines and hand-drawn technical accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101426"/><stop offset=".55" stop-color="#171a35"/><stop offset="1" stop-color="#20213d"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fda4af"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9ca3c7" stroke-opacity=".09" stroke-width="1"/></pattern>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c4b5fd" opacity=".32"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<rect width="1200" height="430" rx="28" fill="url(#grid)"/>
<rect x="770" y="-70" width="460" height="460" fill="url(#dots)" opacity=".5"/>
<circle cx="1000" cy="140" r="170" fill="#7c3aed" opacity=".18" filter="url(#glow)"/>
<circle cx="1080" cy="330" r="110" fill="#22d3ee" opacity=".12" filter="url(#glow)"/>
<path d="M720 38C870 -18 1040 18 1125 145S1166 370 1000 400" fill="none" stroke="#a78bfa" stroke-opacity=".32" stroke-width="1.5" stroke-dasharray="5 8"/>
<path d="M760 52C866 5 1013 35 1080 133" fill="none" stroke="#7dd3fc" stroke-opacity=".45" stroke-width="2"/>
<g fill="#f5d0fe"><circle cx="820" cy="48" r="3"/><circle cx="1110" cy="92" r="2.5"/><circle cx="1147" cy="300" r="3"/></g>
<g stroke="#f0abfc" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M770 110v18m-9-9h18"/><path d="M1140 180v16m-8-8h16"/></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="66" y="52" width="168" height="30" rx="15" fill="#272447" stroke="#8b7cf6" stroke-opacity=".7"/>
  <circle cx="84" cy="67" r="4" fill="#86efac"/>
  <text x="98" y="72" fill="#d8d4fe" font-size="12" letter-spacing="2" font-weight="600">ENGINEERING LOG / 01</text>
  <text x="66" y="154" fill="#f8fafc" font-size="56" font-weight="750" letter-spacing="-2">AAYUSH BEHERA</text>
  <text x="69" y="194" fill="#c4b5fd" font-size="21" font-weight="600" letter-spacing="1.7">FRONTEND  /  FULL-STACK  /  APPLIED AI</text>
  <text x="69" y="235" fill="#cbd5e1" font-size="17">Designing useful interfaces. Engineering the systems behind them.</text>
  <text x="69" y="260" fill="#94a3b8" font-size="14">PRODUCT ENGINEERING  •  DEVELOPER TOOLS  •  EXPERIMENTAL SYSTEMS</text>
  <rect x="68" y="302" width="155" height="43" rx="10" fill="url(#violet)"/>
  <text x="91" y="329" fill="#fff" font-size="13" font-weight="700" letter-spacing=".5">EXPLORE THE WORK ↘</text>
  <rect x="236" y="302" width="144" height="43" rx="10" fill="#222640" stroke="#667085"/>
  <text x="260" y="329" fill="#e2e8f0" font-size="13" font-weight="600">OPEN SOURCE ↗</text>
</g>
<!-- Floating terminal panel -->
<g transform="translate(755 76)">
  <rect x="0" y="0" width="345" height="235" rx="18" fill="#101628" stroke="#64748b" stroke-opacity=".55"/>
  <path d="M0 47H345" stroke="#64748b" stroke-opacity=".35"/>
  <circle cx="22" cy="23" r="4" fill="#fb7185"/><circle cx="38" cy="23" r="4" fill="#fbbf24"/><circle cx="54" cy="23" r="4" fill="#86efac"/>
  <text x="78" y="27" fill="#94a3b8" font-family="monospace" font-size="11">aayush / workspace</text>
  <g font-family="monospace" font-size="12">
    <text x="22" y="79" fill="#a78bfa">$</text><text x="38" y="79" fill="#e2e8f0"> build something useful</text>
    <text x="22" y="108" fill="#7dd3fc">01</text><text x="48" y="108" fill="#cbd5e1">interface.tsx</text>
    <text x="22" y="134" fill="#7dd3fc">02</text><text x="48" y="134" fill="#cbd5e1">services / api</text>
    <text x="22" y="160" fill="#7dd3fc">03</text><text x="48" y="160" fill="#cbd5e1">systems / automate</text>
  </g>
  <rect x="20" y="181" width="305" height="33" rx="7" fill="#1d2940"/>
  <rect x="30" y="191" width="84" height="4" rx="2" fill="#a78bfa"/>
  <rect x="30" y="200" width="180" height="4" rx="2" fill="#475569"/>
  <rect x="220" y="191" width="94" height="15" rx="5" fill="#164e63"/>
  <text x="232" y="202" fill="#a5f3fc" font-family="monospace" font-size="8">BUILD: READY</text>
</g>
<!-- Pixel companion: original little electric fox -->
<g transform="translate(1038 250)" shape-rendering="crispEdges">
  <rect x="32" y="0" width="16" height="16" fill="#fbbf24"/><rect x="16" y="16" width="16" height="16" fill="#fb923c"/><rect x="48" y="16" width="16" height="16" fill="#fb923c"/>
  <rect x="0" y="32" width="16" height="16" fill="#fb923c"/><rect x="16" y="32" width="48" height="16" fill="#fdba74"/><rect x="64" y="32" width="16" height="16" fill="#fb923c"/>
  <rect x="0" y="48" width="16" height="16" fill="#f97316"/><rect x="16" y="48" width="48" height="16" fill="#fed7aa"/><rect x="64" y="48" width="16" height="16" fill="#f97316"/>
  <rect x="16" y="64" width="16" height="16" fill="#fb923c"/><rect x="32" y="64" width="16" height="16" fill="#fed7aa"/><rect x="48" y="64" width="16" height="16" fill="#fb923c"/>
  <rect x="16" y="80" width="16" height="16" fill="#7c3aed"/><rect x="48" y="80" width="16" height="16" fill="#7c3aed"/>
  <rect x="16" y="32" width="8" height="8" fill="#1e293b"/><rect x="56" y="32" width="8" height="8" fill="#1e293b"/>
  <rect x="32" y="48" width="16" height="5" fill="#9a3412"/>
  <rect x="-12" y="64" width="12" height="12" fill="#fbbf24"/><rect x="-22" y="54" width="10" height="10" fill="#fbbf24"/>
  <rect x="79" y="8" width="10" height="10" fill="#67e8f9"/><rect x="91" y="-2" width="8" height="8" fill="#67e8f9"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="930" y="365" width="190" height="32" rx="16" fill="#232644" stroke="#8b7cf6" stroke-opacity=".7"/>
  <text x="952" y="385" fill="#ddd6fe" font-size="11" letter-spacing="1.5">YOUR FRIENDLY BUILD MASCOT</text>
</g>
<path d="M700 365c20-16 42-16 62 0s42 16 62 0" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<path d="M630 110l9 8-9 8-9-8z" fill="#f9a8d4" opacity=".8"/>
</svg>